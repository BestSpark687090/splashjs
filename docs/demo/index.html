<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>splashjs demo</title>
    <style>
        p{
            margin:0;
        }
        body{
            background:gray;
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        </style>
</head>
<body>
    <!-- Span because divs go out all the way. This will need to be accounted for in your code.
     Mostly because the splash text specifically goes on the bottom right of the text! -->
     <br><br><br>
    <span class="splash">Hello this is the place the splash text is gonna go!!!</span>
    <br>
    <textarea rows="12">Use this textarea to test the text's moving capabilities!</textarea>
    <img src="./icon.png" class="icon">
    <img src="./icon.png" class="icon2">
    <script src="./splash.js"></script>
    <div class="targets">
        <p>hello this is a group test</p>
        <p>hello this is a group test</p>
        <p>hello this is a group test</p>
        <p>hello this is a group test</p>
    </div>  
    <br><br><br>

    <p class="default-preset">just the default test</p>
        <script>
        splashjs({
            preset: "default",
            target: ".icon",
            splashes: ["Hello! I am a splash.\nI can change to a different quote\nwhen I refresh!","option 2. This changes\neach time you refresh!"],
            color: "#ffff55",
            // border: "",
            fontSize: "x-large",
            font: "Arial",
            moveInterval: 25,
        })
        splashjs({
            target: ".splash",
            splashes: ["text\nsplash!!"],
            color: "#ffff55",
            // border: "",
            fontSize: "x-large",
            font: "Arial",
            moveInterval: 25
        })
        splashjs({
            target: "textarea",
            splashes: ["This one's on the textarea!!"],
            color: "#ffff55",
            // border: "",
            fontSize: "x-large",
            font: "Arial",
            moveInterval: 25
        })

        // Multiple Target Test
        // I don't know why, but I think it tries to do a nonexistent element last.
        splashjs({
            // requires a query selector for them i guess.
            targets: ".targets>*",
            splashes: ["multi-splash test"],
            moveInterval: 250
        })
        // Expected to error because of no splash array.
        splashjs({
            target: ".default-preset",
            preset: "default"
        })
        // There is NOT a way to do multiple. 
        // I could do a little thing to check if the target's an element.
        // nvm now there is. lemme write a test
    </script>
    <script type="module">
        // Time to make a BeeMovie Script test. Why? Why the heck not!
        const res = await fetch("./beemovie.txt");
        const text = await res.text();
        splashjs({
            target: ".icon2",
            splashes: [text],
        })
        </script>
</body>
</html>
